<style>
  :root{
    --glass-bg: rgba(255,255,255,.14);
    --glass-border: rgba(255,255,255,.28);
    --brand1:#4facfe; --brand2:#00f2fe;
    --ink:#0b1020; --text:#fff; --muted:#e6fbff;
    --nav-h:60px;
  }
  .glass-nav{ z-index:3000; background: linear-gradient(135deg, var(--neon-blue), var(--cyber-purple));
    border-bottom:1px solid var(--glass-border); backdrop-filter: blur(12px); }
  .brand-glass{ color: var(--neon-blue) !important; font-weight:500;
    text-shadow:0 0 12px rgba(0,242,255,.7); letter-spacing:.8px;
    display:inline-flex; align-items:center; gap:8px; }
  .user-shield-icon{ width:20px; height:20px; display:inline-block;
    vertical-align:middle; fill: currentColor; color: var(--neon-blue);
    filter: drop-shadow(0 0 8px rgba(0,242,255,.45)); }
  .menu-btn{ width:32px; height:24px; display:flex; flex-direction:column;
    justify-content:space-between; border:none; background:transparent; cursor:pointer; }
  .menu-btn .bar{ height:3px; width:100%; background-color:rgba(0,242,255,.7);
    border-radius:4px; transition:.35s; box-shadow:0 0 8px rgba(0,242,255,.7); }
  .menu-btn.active .bar:nth-child(1){ transform: rotate(45deg) translate(5px,5px); }
  .menu-btn.active .bar:nth-child(2){ opacity:0; }
  .menu-btn.active .bar:nth-child(3){ transform: rotate(-45deg) translate(6px,-6px); }
  .menu-btn.disabled{ opacity:.4; pointer-events:none; }

  .menu-overlay{ position:fixed; top:var(--nav-h); left:0; width:100%;
    height:calc(100% - var(--nav-h)); background:rgba(0,0,0,.5);
    z-index:2000; display:none; }
  .menu-overlay.show{ display:block; }

  .slide-menu{ position:fixed; top:var(--nav-h); right:0; width:0;
    height:calc(100% - var(--nav-h)); background: var(--panel-bg);
    backdrop-filter: blur(14px); border-left:1px solid var(--glass-border);
    box-shadow:-8px 0 24px rgba(0,0,0,.5); overflow:hidden;
    transition: width .35s ease; z-index:2500; display:flex; flex-direction:column; }
  .slide-menu.open{ width:240px; }

  .menu-header{ padding:14px 16px; text-align:center;
    background: linear-gradient(135deg, rgba(0,242,255,.15), rgba(125,0,255,.25));
    color: var(--neon-blue); font-weight:500;
    text-shadow:0 0 10px rgba(0,242,255,.7);
    border-bottom:1px solid var(--glass-border); }

  .menu-links{ padding:6px 0; flex:1; overflow-y:auto; }
  .menu-links a{ display:block; padding:12px 18px; color:#e0f7fa; font-weight:500;
    text-decoration:none; border-right:4px solid transparent;
    transform:translateX(24px); opacity:0; transition:all .3s ease; }
  .slide-menu.open .menu-links a{ transform:translateX(0); opacity:1; }
  .menu-links a:hover{ background: rgba(0,242,255,.12); color:#fff;
    border-right:4px solid var(--neon-blue); }

  .menu-divider{ height:1px; background:rgba(255,255,255,.15); margin:10px 16px; }
  .logout-link{ color: red !important; }
  .menu-footer{ padding:10px 12px; border-top:1px solid rgba(255,255,255,.1);
    display:flex; gap:8px; }
  .chip{ padding:6px 10px; border-radius:999px; background:rgba(0,242,255,.1);
    border:1px solid var(--glass-border); font-size:12px; color:#fff; }
</style>

<script>
  (function(){
    const menu=document.getElementById('slideMenu');
    const overlay=document.getElementById('menuOverlay');
    const btn=document.querySelector('.menu-btn');

    window.toggleMenu=function(button){
      if(menu.classList.contains('open')){
        menu.classList.remove('open'); overlay.classList.remove('show');
        button.classList.remove('active'); button.setAttribute('aria-expanded','false');
      } else {
        menu.classList.add('open'); overlay.classList.add('show');
        button.classList.add('active'); button.setAttribute('aria-expanded','true');
      }
    }
    window.closeMenu=function(){
      menu.classList.remove('open'); overlay.classList.remove('show');
      btn?.classList.remove('active'); btn?.setAttribute('aria-expanded','false');
    }
    document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeMenu(); });
  })();
</script>
