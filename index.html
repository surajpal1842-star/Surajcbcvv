<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA KEY TESTER</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:#05070d;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:430px;
  background:#0c101a;
  border:1px solid #263044;
  border-radius:22px;
  padding:24px;
  box-shadow:0 0 40px rgba(0,0,0,.5);
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:900;
  letter-spacing:3px;
  margin-bottom:5px;
}

.sub{
  text-align:center;
  color:#7d879c;
  font-size:12px;
  margin-bottom:25px;
}

label{
  display:block;
  color:#9da7bb;
  font-size:12px;
  margin:15px 0 7px;
}

input,select{
  width:100%;
  padding:13px;
  border-radius:11px;
  border:1px solid #293348;
  background:#070a11;
  color:#fff;
  outline:none;
}

input:focus,select:focus{
  border-color:#00e5ff;
}

button{
  width:100%;
  padding:14px;
  margin-top:18px;
  border:0;
  border-radius:12px;
  background:#00e5ff;
  color:#001014;
  font-weight:900;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.keybox{
  margin-top:20px;
  padding:15px;
  border-radius:13px;
  background:#070a11;
  border:1px dashed #34405a;
  display:none;
}

.key{
  word-break:break-all;
  font-size:15px;
  font-weight:bold;
  color:#00e5ff;
}

.status{
  margin-top:18px;
  padding:14px;
  border-radius:12px;
  background:#080b12;
  text-align:center;
  font-weight:bold;
}

.ok{color:#00ff9d;}
.bad{color:#ff526b;}

.small{
  color:#68748b;
  font-size:11px;
  text-align:center;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">NEXORA</div>
  <div class="sub">KEY MANAGEMENT • TEST PANEL</div>

  <label>CONNECT URL</label>
  <input id="connectUrl"
         placeholder="https://example.com/connect">

  <label>KEY EXPIRY</label>
  <select id="expiry">
    <option value="1">1 Hour</option>
    <option value="24">24 Hours</option>
    <option value="72">3 Days</option>
    <option value="168">7 Days</option>
    <option value="720">30 Days</option>
  </select>

  <button onclick="generateKey()">GENERATE TEST KEY</button>

  <div class="keybox" id="keyBox">
    <div style="font-size:11px;color:#778399;margin-bottom:7px">
      GENERATED KEY
    </div>

    <div class="key" id="generatedKey"></div>

    <button onclick="copyKey()">COPY KEY</button>
  </div>

  <div class="status" id="status">
    No key generated
  </div>

  <button onclick="testKey()">TEST KEY</button>

  <div class="small">
    TEST MODE — Keys are stored only in this browser.
  </div>

</div>

<script>

let currentKey = "";
let expiryTime = 0;

function randomPart(length){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let result = "";

  for(let i=0;i<length;i++){
    result += chars[Math.floor(Math.random()*chars.length)];
  }

  return result;
}

function generateKey(){

  currentKey =
    "NEXORA-" +
    randomPart(5) + "-" +
    randomPart(5) + "-" +
    randomPart(5);

  const hours =
    Number(document.getElementById("expiry").value);

  expiryTime =
    Date.now() + (hours * 60 * 60 * 1000);

  document.getElementById("generatedKey").textContent =
    currentKey;

  document.getElementById("keyBox").style.display =
    "block";

  document.getElementById("status").innerHTML =
    "KEY GENERATED";

  document.getElementById("status").className =
    "status ok";

  localStorage.setItem("testKey", currentKey);
  localStorage.setItem("testExpiry", expiryTime);

}

function copyKey(){

  if(!currentKey) return;

  navigator.clipboard.writeText(currentKey);

  document.getElementById("status").innerHTML =
    "KEY COPIED ✓";

  document.getElementById("status").className =
    "status ok";
}

function testKey(){

  const savedKey =
    localStorage.getItem("testKey");

  const savedExpiry =
    Number(localStorage.getItem("testExpiry"));

  if(!savedKey){

    document.getElementById("status").innerHTML =
      "NO KEY FOUND";

    document.getElementById("status").className =
      "status bad";

    return;
  }

  if(Date.now() > savedExpiry){

    document.getElementById("status").innerHTML =
      "KEY EXPIRED ✕";

    document.getElementById("status").className =
      "status bad";

    return;
  }

  document.getElementById("status").innerHTML =
    "KEY VALID ✓";

  document.getElementById("status").className =
    "status ok";
}

</script>

</body>
</html>
