<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAFIA MODE SERVER — Key Panel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0f0a1f, #1a0a2e);
    color: #fff;
    min-height: 100vh;
    padding: 20px;
  }
  .wrap { max-width: 500px; margin: 0 auto; }
  h1 {
    text-align: center;
    font-size: 22px;
    letter-spacing: 2px;
    margin: 20px 0;
    text-shadow: 0 0 20px #4facfe;
  }
  .card {
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    backdrop-filter: blur(10px);
  }
  h3 { color: #4facfe; font-size: 14px; margin-bottom: 14px; letter-spacing: 1px; }
  label { font-size: 11px; color: #a0a0c0; display: block; margin-bottom: 6px; text-transform: uppercase; }
  input, select {
    width: 100%;
    padding: 12px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 10px;
    color: #fff;
    font-size: 14px;
    margin-bottom: 12px;
    font-family: inherit;
  }
  input:focus, select:focus {
    outline: none;
    border-color: #4facfe;
    box-shadow: 0 0 0 3px rgba(79,172,254,.2);
  }
  select option { background: #1a0a2e; color: #fff; }
  button {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #4facfe, #7d00ff);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 1px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  .key-box {
    background: rgba(0,242,255,.08);
    border: 1px dashed #4facfe;
    border-radius: 10px;
    padding: 14px;
    margin-top: 12px;
    text-align: center;
    display: none;
  }
  .key-box.show { display: block; }
  .key-text {
    font-family: monospace;
    font-size: 18px;
    color: #00f2fe;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 8px;
    word-break: break-all;
  }
  .btn-copy {
    padding: 8px 16px;
    background: rgba(0,242,255,.15);
    border: 1px solid #00f2fe;
    border-radius: 8px;
    color: #00f2fe;
    font-size: 12px;
    cursor: pointer;
    width: auto;
  }
  .key-item {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
  }
  .key-item .code { font-family: monospace; color: #00f2fe; font-weight: 700; font-size: 13px; }
  .key-item .info { color: #888; font-size: 10px; margin-top: 3px; }
  .key-item .del {
    background: rgba(255,60,60,.15);
    border: 1px solid #ff4c4c;
    color: #ff6b6b;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 11px;
    cursor: pointer;
    width: auto;
  }
  .msg {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: #1a1a2e;
    border: 1px solid #4facfe;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 13px;
    transition: .3s;
    z-index: 999;
  }
  .msg.show { transform: translateX(-50%) translateY(0); }
  .msg.err { border-color: #ff4c4c; }
  .hidden { display: none !important; }
  .empty { text-align: center; color: #555; padding: 20px; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">

  <h1>⚡ MAFIA MODE SERVER</h1>

  <!-- LOGIN -->
  <div class="card" id="loginCard">
    <h3>🔐 ADMIN LOGIN</h3>
    <label>Admin Password</label>
    <input type="password" id="adminPass" placeholder="Enter password">
    <button onclick="doLogin()">UNLOCK</button>
  </div>

  <!-- GENERATOR -->
  <div class="card hidden" id="genCard">
    <h3>➕ CREATE KEY</h3>
    <label>Duration</label>
    <select id="dur">
      <option value="1">1 Day</option>
      <option value="7" selected>7 Days</option>
      <option value="30">30 Days</option>
      <option value="365">1 Year</option>
      <option value="0">Lifetime</option>
    </select>
    <label>Device Limit</label>
    <input type="number" id="devLim" value="1" min="1" max="10">
    <button onclick="makeKey()">GENERATE KEY</button>
    <div class="key-box" id="keyBox">
      <div class="key-text" id="keyText"></div>
      <button class="btn-copy" onclick="copyKey()">📋 COPY</button>
    </div>
  </div>

  <!-- LIST -->
  <div class="card hidden" id="listCard">
    <h3>📋 ALL KEYS</h3>
    <div id="keysList"></div>
  </div>

</div>

<div class="msg" id="msg"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, remove, onValue } 
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const cfg = {
  apiKey: "AIzaSyCajK7dqg2SS-FRSbJHxonQQxr49NF5vZ8",
  authDomain: "fuck-c46e9.firebaseapp.com",
  databaseURL: "https://fuck-c46e9-default-rtdb.firebaseio.com",
  projectId: "fuck-c46e9",
  storageBucket: "fuck-c46e9.firebasestorage.app",
  messagingSenderId: "1043993934415",
  appId: "1:1043993934415:android:30ebdcdc70ca8cbf88083a"
};

const app = initializeApp(cfg);
const db = getDatabase(app);

let PASSWORD = "";
let allKeys = {};

function msg(t, err) {
  const m = document.getElementById("msg");
  m.textContent = t;
  m.className = "msg show" + (err ? " err" : "");
  setTimeout(() => m.classList.remove("show"), 2500);
}

window.doLogin = async function() {
  const p = document.getElementById("adminPass").value.trim();
  if (!p) return msg("Password daal", true);
  try {
    const s = await get(ref(db, "admin_secret"));
    if (!s.exists() || s.val() !== p) return msg("❌ Galat password", true);
    PASSWORD = p;
    document.getElementById("loginCard").classList.add("hidden");
    document.getElementById("genCard").classList.remove("hidden");
    document.getElementById("listCard").classList.remove("hidden");
    loadKeys();
    msg("✅ Unlocked");
  } catch(e) { msg("Error: " + e.message, true); }
}

function randKey() {
  const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i = 0; i < 16; i++) s += c[Math.floor(Math.random()*c.length)];
  return s;
}

window.makeKey = async function() {
  const days = parseInt(document.getElementById("dur").value);
  const devLim = parseInt(document.getElementById("devLim").value) || 1;
  const code = randKey();
  const now = Math.floor(Date.now()/1000);
  const exp = days === 0 ? 0 : now + days * 86400;

  try {
    await set(ref(db, "keys/" + code), {
      created: now,
      expires: exp,
      duration: days === 0 ? "lifetime" : days + "days",
      device_limit: devLim,
      devices: {},
      status: "active"
    });
    document.getElementById("keyText").textContent = code;
    document.getElementById("keyBox").classList.add("show");
    msg("⚡ Key ban gayi!");
  } catch(e) { msg("Error: " + e.message, true); }
}

window.copyKey = function() {
  const k = document.getElementById("keyText").textContent;
  navigator.clipboard.writeText(k);
  msg("📋 Copied!");
}

function loadKeys() {
  onValue(ref(db, "keys"), s => {
    allKeys = s.val() || {};
    render();
  });
}

function render() {
  const box = document.getElementById("keysList");
  const ids = Object.keys(allKeys);
  if (ids.length === 0) {
    box.innerHTML = '<div class="empty">Koi key nahi hai</div>';
    return;
  }
  const now = Math.floor(Date.now()/1000);
  ids.sort((a,b) => allKeys[b].created - allKeys[a].created);
  box.innerHTML = ids.map(id => {
    const k = allKeys[id];
    const exp = k.expires !== 0 && k.expires < now;
    const dl = k.expires === 0 ? "∞" : Math.max(0, Math.ceil((k.expires-now)/86400));
    return `
      <div class="key-item">
        <div>
          <div class="code">${id}</div>
          <div class="info">${exp ? '❌ EXPIRED' : '✅ ' + dl + ' days'} · ${k.duration}</div>
        </div>
        <button class="del" onclick="delKey('${id}')">🗑</button>
      </div>`;
  }).join("");
}

window.delKey = async function(id) {
  if (!confirm("Delete " + id + "?")) return;
  await remove(ref(db, "keys/" + id));
  msg("🗑 Deleted");
}
</script>
</body>
</html>
