<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUNAR KEY GENERATOR</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #080a13;
            color: #f4f6ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 16% 12%, #6050ff29, transparent 26rem),
                        radial-gradient(circle at 88% 83%, #2ec3ff1a, transparent 28rem),
                        #080a13;
        }
        .card {
            background: linear-gradient(145deg, #1a1f36cf, #0d101ec4);
            border: 1px solid #b2bbff21;
            backdrop-filter: blur(18px);
            border-radius: 22px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 28px 70px #0000004d, inset 0 1px #ffffff12;
            text-align: center;
        }
        .lunar-mark {
            background: linear-gradient(145deg, #8d7bff3d, #30ddff0f);
            border: 1px solid #a091ff59;
            border-radius: 16px;
            width: 56px;
            height: 56px;
            display: grid;
            place-items: center;
            font-size: 26px;
            margin: 0 auto 12px;
            position: relative;
            box-shadow: inset 0 1px #ffffff24, 0 0 28px #805fff2e;
        }
        .lunar-orbit {
            border: 1px solid #57deffb8;
            border-radius: 50%;
            width: 36px;
            height: 16px;
            position: absolute;
            transform: rotate(-28deg);
            box-shadow: 0 0 10px #57deff57;
        }
        .brand-name { font-size: 18px; font-weight: 700; letter-spacing: .13em; }
        .brand-subtitle { color: #8a92ae; font-size: 10px; letter-spacing: .1em; margin-top: 4px; }
        .eyebrow { font-size: 11px; font-family: monospace; letter-spacing: .15em; color: #a69aff; margin: 20px 0 8px; }
        .eyebrow i { color: #62e4ff; margin-right: 6px; }
        h1 { font-size: 26px; margin: 10px 0 6px; }
        .muted { color: #8a92ae; font-size: 13px; line-height: 1.6; }
        .key-display {
            background: #0407107a;
            border: 1px solid #96a1e833;
            border-radius: 12px;
            padding: 16px;
            margin: 18px 0;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            color: #7be7ff;
            word-break: break-all;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .key-display.loading { color: #5a6380; font-size: 14px; }
        .key-display.success { color: #9bffd1; border-color: #4beca533; background: #4beca517; }
        .key-display.error { color: #ffbac6; border-color: #ff667f33; background: #ff667f17; }
        .nexus-button {
            border: none;
            border-radius: 11px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 50px;
            padding: 0 28px;
            font-size: 14px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            transition: transform .16s, box-shadow .16s;
        }
        .nexus-button:active { transform: scale(.97); }
        .nexus-button:disabled { opacity: .5; cursor: not-allowed; }
        .primary {
            background: linear-gradient(100deg, #8372fa, #48d8f9);
            color: #07101f;
            box-shadow: 0 12px 28px #6470ff3d;
        }
        .primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 16px 35px #6470ff61; }
        .secondary { background: #8294ff17; border: 1px solid #94a2ff36; color: #c9d3ff; }
        .secondary:hover:not(:disabled) { background: #8294ff29; }
        .divider { background: #b2bbff21; height: 1px; margin: 18px 0; }
        .info-row { display: flex; justify-content: space-between; font-size: 12px; color: #8a92ae; padding: 4px 0; }
        .info-row span:last-child { color: #c9d3ff; }
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
        .status-dot.green { background: #62f5ac; box-shadow: 0 0 0 4px #62f5ac1f; }
        .status-dot.red { background: #ff667f; box-shadow: 0 0 0 4px #ff667f1f; }
        .status-dot.yellow { background: #ffcd8c; box-shadow: 0 0 0 4px #ffb0491f; }
        .flex { display: flex; gap: 8px; }
        .mt-2 { margin-top: 8px; }
    </style>
</head>
<body>
<div class="card">
    <div class="lunar-mark">🌙<span class="lunar-orbit"></span></div>
    <div class="brand-name">LUNAR CLIENT</div>
    <div class="brand-subtitle">⚡ ONE-CLICK KEY GENERATOR</div>
    <div class="eyebrow"><i>🔑</i> GENERATE PROXY KEY</div>
    <h1>One click. Instant key.</h1>
    <p class="muted">Generates a time-limited proxy key bound to your IP.</p>
    <div class="key-display" id="keyDisplay"><span id="keyText">Click "Generate Key"</span></div>
    <button class="nexus-button primary" id="generateBtn"><span>⚡</span> Generate Key</button>
    <div class="divider"></div>
    <div class="info-row"><span>Status</span><span id="statusText"><span class="status-dot yellow"></span> Ready</span></div>
    <div class="info-row"><span>Session</span><span id="sessionId">—</span></div>
    <div class="info-row"><span>Expires</span><span id="expiryText">—</span></div>
    <div class="divider"></div>
    <div class="flex mt-2">
        <button class="nexus-button secondary" id="copyBtn" style="flex:1; min-height:40px; font-size:12px;" disabled>📋 Copy Key</button>
        <button class="nexus-button secondary" id="resetBtn" style="flex:1; min-height:40px; font-size:12px;">🔄 Reset</button>
    </div>
</div>
<script>
(function() {
    const API = '/api/trpc';
    const keyDisplay = document.getElementById('keyDisplay');
    const keyText = document.getElementById('keyText');
    const generateBtn = document.getElementById('generateBtn');
    const copyBtn = document.getElementById('copyBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusText = document.getElementById('statusText');
    const sessionIdEl = document.getElementById('sessionId');
    const expiryText = document.getElementById('expiryText');
    let currentKey = '', currentSession = '', currentExpiry = '';

    function setStatus(type, msg) {
        const dots = { ready: '<span class="status-dot yellow"></span>', loading: '<span class="status-dot yellow"></span>', success: '<span class="status-dot green"></span>', error: '<span class="status-dot red"></span>' };
        statusText.innerHTML = (dots[type] || dots.ready) + ' ' + msg;
    }
    function setKeyDisplay(type, msg) { keyDisplay.className = 'key-display ' + type; keyText.textContent = msg; }
    function setExpiry(e) { expiryText.textContent = e ? new Date(e).toLocaleString() : '—'; }

    async function generateKey() {
        generateBtn.disabled = true;
        generateBtn.innerHTML = '<span>⏳</span> Generating...';
        setStatus('loading', 'Starting...');
        setKeyDisplay('loading', '⏳ Connecting...');
        try {
            // Start session
            const s = await fetch(API + '/access.startGetKeySession', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).then(r => r.json());
            const sid = s?.result?.data?.id;
            if (!sid) throw new Error('Session failed');
            currentSession = sid;
            sessionIdEl.textContent = sid.slice(0,12)+'...';
            setStatus('loading', 'Completing steps...');
            // Complete 4 steps
            for (let step of [1,2,3,4]) {
                setKeyDisplay('loading', `⏳ Step ${step}/4...`);
                await fetch(API + '/access.completeGetKeyStep', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sessionId: sid, step }) });
            }
            setStatus('loading', 'Claiming key...');
            setKeyDisplay('loading', '⏳ Claiming...');
            // Claim key
            const k = await fetch(API + '/access.issueGetKey', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sessionId: sid }) }).then(r => r.json());
            const key = k?.result?.data?.keyValue;
            if (!key) throw new Error('Claim failed');
            currentKey = key;
            currentExpiry = k?.result?.data?.expiresAt || k?.result?.data?.issuedKeyExpiresAt;
            setKeyDisplay('success', key);
            setStatus('success', '✅ Key generated!');
            setExpiry(currentExpiry);
            copyBtn.disabled = false;
            await navigator.clipboard.writeText(key);
            setStatus('success', '✅ Copied to clipboard!');
        } catch(e) {
            setKeyDisplay('error', '❌ ' + e.message);
            setStatus('error', '❌ ' + e.message);
        }
        generateBtn.disabled = false;
        generateBtn.innerHTML = '<span>⚡</span> Generate Key';
    }

    async function copyKey() { if(currentKey) { await navigator.clipboard.writeText(currentKey); setStatus('success', '✅ Copied!'); } }
    function resetAll() { currentKey=''; currentSession=''; currentExpiry=''; setKeyDisplay('', 'Click "Generate Key"'); setStatus('ready', 'Ready'); sessionIdEl.textContent='—'; expiryText.textContent='—'; copyBtn.disabled=true; }

    generateBtn.addEventListener('click', generateKey);
    copyBtn.addEventListener('click', copyKey);
    resetBtn.addEventListener('click', resetAll);
})();
</script>
</body>
</html>
