<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝗡𝗘𝗫𝗢𝗥𝗔 𝗙𝗙 𝗠𝗢𝗗𝗫 | SURAJ 😈</title>
    
    <link rel="preload" as="image" href="https://i.ibb.co/d0yqvML0/cropped-circle-image-1.jpg">
    
    <!-- Background Music - Fast & Hacker Style -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://www.myinstants.com/media/sounds/hacker-sound-effect.mp3" type="audio/mpeg">
        <source src="https://www.myinstants.com/media/sounds/cyberpunk-2077-sound-effect.mp3" type="audio/mpeg">
    </audio>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        :root {
            --primary: #00ff88;
            --secondary: #8a2be2;
            --bg: #03030b;
            --accent: #ff6b00;
            --neon-blue: #00f2ff;
            --neon-pink: #ff00ff;
        }

        * { 
            box-sizing: border-box; 
            cursor: crosshair; 
            margin: 0;
            padding: 0;
        }
        
        body {
            background: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Orbitron', 'Courier New', monospace;
            color: #fff;
            overflow: hidden;
            padding: 20px;
            position: relative;
        }

        /* Matrix Rain Effect */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.12;
            pointer-events: none;
        }

        /* Particle Canvas */
        #particle-canvas {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* RAINBOW ANIMATIONS - FAST */
        @keyframes rainbowGlow {
            0% { 
                box-shadow: 0 0 30px rgba(255, 0, 0, 0.8),
                            0 0 60px rgba(255, 0, 0, 0.5);
            }
            20% { 
                box-shadow: 0 0 30px rgba(255, 165, 0, 0.8),
                            0 0 60px rgba(255, 165, 0, 0.5);
            }
            40% { 
                box-shadow: 0 0 30px rgba(255, 255, 0, 0.8),
                            0 0 60px rgba(255, 255, 0, 0.5);
            }
            60% { 
                box-shadow: 0 0 30px rgba(0, 255, 0, 0.8),
                            0 0 60px rgba(0, 255, 0, 0.5);
            }
            80% { 
                box-shadow: 0 0 30px rgba(0, 191, 255, 0.8),
                            0 0 60px rgba(0, 191, 255, 0.5);
            }
            100% { 
                box-shadow: 0 0 30px rgba(255, 0, 0, 0.8),
                            0 0 60px rgba(255, 0, 0, 0.5);
            }
        }

        @keyframes rainbowRotate {
            0% { border-color: #ff0000; }
            20% { border-color: #ffa500; }
            40% { border-color: #ffff00; }
            60% { border-color: #00ff00; }
            80% { border-color: #00bfff; }
            100% { border-color: #ff0000; }
        }

        @keyframes fastFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(0.5deg); }
        }

        @keyframes glitchText {
            0%, 100% { transform: skew(0deg); }
            10% { transform: skew(1.5deg); }
            20% { transform: skew(-1.5deg); }
            30% { transform: skew(1deg); }
            40% { transform: skew(-1deg); }
            50% { transform: skew(0deg); }
        }

        @keyframes pulseFast {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.98); }
        }

        .main-card {
            width: 95%;
            max-width: 480px;
            background: rgba(10, 10, 25, 0.92);
            border: 3px solid #ff0000;
            border-radius: 25px;
            padding: 25px;
            text-align: center;
            position: relative;
            animation: rainbowRotate 3s linear infinite, fastFloat 4s ease-in-out infinite;
            backdrop-filter: blur(15px);
            z-index: 10;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.1);
        }

        .main-card::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            background: linear-gradient(45deg, #ff0000, #ffa500, #ffff00, #00ff00, #00bfff, #8a2be2, #ff0000);
            background-size: 300% 300%;
            border-radius: 28px;
            z-index: -1;
            animation: rainbowGlow 2s linear infinite, gradientShift 4s ease infinite;
            opacity: 0.6;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .logo-section {
            width: 90px;
            height: 90px;
            margin: -70px auto 15px;
            background: #000;
            border: 3px solid #fff;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: rainbowRotate 4s linear infinite, fastFloat 3s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
            position: relative;
            z-index: 20;
        }

        .logo-section::before {
            content: '';
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            background: linear-gradient(45deg, #ff0000, #ffa500, #ffff00, #00ff00, #00bfff, #8a2be2);
            background-size: 300% 300%;
            border-radius: 50%;
            z-index: -1;
            animation: gradientShift 3s linear infinite;
            opacity: 0.5;
        }
        
        .logo-section img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block;
            border-radius: 50%;
            animation: pulseFast 2s ease-in-out infinite;
        }

        .owner-badge {
            background: linear-gradient(90deg, #ff0000, #ffa500, #ffff00, #00ff00, #00bfff, #8a2be2, #ff0000);
            background-size: 300% 300%;
            padding: 8px 25px;
            border-radius: 50px;
            display: inline-block;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 12px;
            animation: gradientShift 2s linear infinite;
            color: #fff;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .owner-badge::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: shine 2s linear infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .title-text {
            font-size: 2rem;
            font-weight: 900;
            margin: 8px 0;
            background: linear-gradient(90deg, #ff0000, #ffa500, #ffff00, #00ff00, #00bfff, #8a2be2);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientShift 2s linear infinite, glitchText 3s ease-in-out infinite;
            letter-spacing: 2px;
        }

        .user-info {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 10px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 11px;
            text-transform: uppercase;
            font-weight: bold;
            animation: rainbowRotate 5s linear infinite;
        }

        .info-box {
            padding: 6px;
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .info-box:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,0.1);
        }

        .info-box span { 
            display: block; 
            color: var(--primary); 
            font-size: 13px; 
            margin-top: 4px;
            text-shadow: 0 0 10px var(--primary);
            font-weight: 900;
        }

        .terminal {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid rgba(0, 255, 136, 0.3);
            height: 130px;
            margin-bottom: 20px;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            text-align: left;
            overflow-y: auto;
            color: #00ff88;
            border-radius: 12px;
            position: relative;
            animation: rainbowRotate 6s linear infinite;
        }

        .terminal::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #ff0000, #ffa500, #ffff00, #00ff00, #00bfff, #8a2be2);
            background-size: 300% 100%;
            animation: gradientShift 2s linear infinite;
        }

        .terminal::-webkit-scrollbar {
            width: 3px;
        }

        .terminal::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.3);
        }

        .terminal::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .btn-main {
            width: 100%; 
            padding: 16px;
            background: linear-gradient(45deg, #ff0000, #ffa500, #ffff00);
            background-size: 300% 300%;
            color: #fff; 
            border: none; 
            border-radius: 12px;
            font-weight: 900; 
            text-transform: uppercase;
            cursor: pointer; 
            transition: 0.3s; 
            font-size: 15px;
            box-shadow: 0 4px 20px rgba(255,0,0,0.4);
            position: relative;
            overflow: hidden;
            animation: gradientShift 2s linear infinite;
            letter-spacing: 1px;
        }

        .btn-main:hover { 
            transform: scale(1.03); 
            box-shadow: 0 0 30px var(--primary);
            animation: gradientShift 0.8s linear infinite;
        }

        .btn-main::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: rgba(255,255,255,0.1);
            transform: rotate(45deg);
            animation: shine 1.5s linear infinite;
        }

        .result-box {
            display: none; 
            background: rgba(0,0,0,0.7);
            padding: 20px; 
            border-radius: 15px;
            border: 3px dashed var(--primary); 
            margin-top: 20px;
            animation: rainbowRotate 4s linear infinite;
            position: relative;
            overflow: hidden;
        }

        .result-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.05), transparent);
            animation: gradientShift 3s linear infinite;
        }

        .key-text {
            font-size: 1.4rem; 
            color: #fff;
            display: block; 
            margin: 12px 0; 
            padding: 15px;
            background: rgba(0,0,0,0.5); 
            border-radius: 10px;
            text-shadow: 0 0 20px var(--primary); 
            border: 2px solid var(--primary);
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            animation: rainbowGlow 2s linear infinite, glitchText 2s ease-in-out infinite;
            font-weight: 900;
            word-break: break-all;
            font-size: 1.1rem;
        }

        .key-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 12px 0;
            padding: 12px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .key-info-item {
            font-size: 10px;
            color: #aaa;
            text-transform: uppercase;
        }

        .key-info-item span {
            display: block;
            color: var(--neon-blue);
            font-size: 12px;
            margin-top: 3px;
            font-weight: 900;
            text-shadow: 0 0 10px var(--neon-blue);
            animation: pulseFast 1.5s infinite;
        }

        .social-grid { 
            display: flex; 
            gap: 12px; 
            margin-top: 20px; 
        }
        
        .social-btn { 
            flex: 1; 
            padding: 12px; 
            border-radius: 10px; 
            border: 2px solid #fff; 
            background: transparent; 
            color: #fff; 
            font-size: 11px; 
            cursor: pointer; 
            transition: all 0.3s ease;
            font-weight: bold;
            position: relative;
            overflow: hidden;
            animation: rainbowRotate 5s linear infinite;
        }

        .social-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(255,255,255,0.2);
        }

        .social-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: 0.4s;
        }

        .social-btn:hover::before {
            left: 100%;
        }

        /* Scanline Effect */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 255, 65, 0.02) 2px,
                rgba(0, 255, 65, 0.02) 4px
            );
            pointer-events: none;
            z-index: 999;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #00ff88;
            animation: spin 0.8s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes successPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .success-animation {
            animation: successPulse 0.4s ease-in-out 3;
        }

        .footer-text {
            margin-top: 15px;
            font-size: 9px;
            color: rgba(255,255,255,0.2);
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <!-- Matrix Canvas -->
    <canvas id="matrix-canvas"></canvas>
    
    <!-- Particle Canvas -->
    <canvas id="particle-canvas"></canvas>
    
    <!-- Scanline Effect -->
    <div class="scanline"></div>

    <div class="main-card">
        <div class="logo-section">
            <img src="https://i.ibb.co/d0yqvML0/cropped-circle-image-1.jpg" alt="NEXORA LOGO" loading="eager" fetchpriority="high">
        </div>

        <div class="owner-badge">👑 OWNER: SURAJ 😈</div>
        <h1 class="title-text">𝗡𝗘𝗫𝗢𝗥𝗔 𝗙𝗙 𝗠𝗢𝗗𝗫</h1>

        <div class="user-info">
            <div class="info-box">👥 LIVE<span id="onlineCount">1,000+</span></div>
            <div class="info-box">📊 USER<span>10M+</span></div>
            <div class="info-box">⚡ PING<span id="pingVal">-- ms</span></div>
        </div>

        <div class="terminal" id="term">
            <div id="term-content">
                ⚡ System: Ready<br>

        <div id="action-area">
            <button class="btn-main" onclick="startFlow()">🚀 GENERATE ACCESS KEY</button>
        </div>

        <div id="procBar" style="display:none; margin:20px 0;">
            <div style="color:var(--accent); font-weight:bold; font-size: 14px; text-shadow: 0 0 10px var(--accent);">
                <span class="loading-spinner"></span>
                🔄 VERIFYING: <span id="timer">5</span>s
            </div>
            <div style="width:100%; height:10px; background:#111; border-radius:10px; margin-top:12px; overflow:hidden; border:1px solid rgba(255,255,255,0.1);">
                <div id="pBar" style="width:0%; height:100%; background:linear-gradient(90deg, #ff0000, #ffa500, #ffff00, #00ff00, #00bfff, #8a2be2); background-size: 300% 100%; animation: gradientShift 1.5s linear infinite; transition:0.8s linear;"></div>
            </div>
        </div>

        <div id="result-area" class="result-box">
            <span style="font-size:13px; color:#aaa; display:block; margin-bottom:8px;">🔓 VIP KEY UNLOCKED</span>
            <span class="key-text" id="keyOutput">...</span>
            
            <div class="key-info">
                <div class="key-info-item">
                    📍 DEVICE/IP
                    <span id="deviceInfo">Detecting...</span>
                </div>
                <div class="key-info-item">
                    ⏳ VALID FOR
                    <span id="validityInfo">24 Hours ⏰</span>
                </div>
            </div>
            
            <button class="btn-main" onclick="copyKey()" style="background:linear-gradient(45deg, #00ff00, #00bfff);">📋 COPY KEY</button>
        </div>

        <div class="social-grid">
            <button class="social-btn" style="border-color:#0088cc; color:#0088cc;" onclick="window.open('https://t.me/+A6gOgQKrDTA5NDFl')">📱 TELEGRAM</button>
            <button class="social-btn" style="border-color:#ff0000; color:#ff0000;" onclick="window.open('https://youtube.com/@nexora-ofc-oo?si=41O9uYJHkD7K1n3Y')">▶️ YOUTUBE</button>
        </div>
        
        <div class="footer-text">
            ⚡ POWERED BY SURAJ &amp; NEXORA TEAM ⚡
        </div>
    </div>

    <script>
        // ===== CONFIGURATION =====
        const API_KEY = "c96b87f01a26be8731712a777feb2ea7500b6a18";
        const BASE_URL = "https://vplink.in/api";
        const DESTINATION_URL = "https://yourdestinationlink.com";
        const ALIAS = "nexoraff";
        
        // ===== RANDOM KEY GENERATOR =====
        function generateRandomKey() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            const segments = [];
            
            segments.push('NEX');
            
            for (let i = 0; i < 4; i++) {
                let segment = '';
                for (let j = 0; j < 4; j++) {
                    segment += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                segments.push(segment);
            }
            
            const timestamp = Date.now().toString(36).toUpperCase();
            const key = segments.join('-') + '-' + timestamp.substring(0, 4);
            
            return key;
        }

        // ===== GET DEVICE INFO =====
        function getDeviceInfo() {
            const userAgent = navigator.userAgent;
            let device = 'Unknown Device';
            
            if (/Android/i.test(userAgent)) {
                device = '📱 Android';
            } else if (/iPhone|iPad|iPod/i.test(userAgent)) {
                device = '📱 iOS';
            } else if (/Windows/i.test(userAgent)) {
                device = '💻 Windows';
            } else if (/Mac/i.test(userAgent)) {
                device = '💻 Mac';
            } else if (/Linux/i.test(userAgent)) {
                device = '🐧 Linux';
            }
            
            fetch('https://api.ipify.org?format=json')
                .then(response => response.json())
                .then(data => {
                    if (data.ip) {
                        document.getElementById('deviceInfo').innerHTML = `${device}<br><span style="font-size:9px;color:#00ff88;">IP: ${data.ip}</span>`;
                    }
                })
                .catch(() => {
                    document.getElementById('deviceInfo').innerHTML = `${device}<br><span style="font-size:9px;color:#ff6b00;">IP: Private</span>`;
                });
        }

        // ===== BACKGROUND MUSIC - FAST & INTENSE =====
        let isMusicPlaying = false;

        function toggleMusic() {
            const audio = document.getElementById('bgMusic');
            if (isMusicPlaying) {
                audio.pause();
                isMusicPlaying = false;
            } else {
                audio.play().catch(() => {});
                isMusicPlaying = true;
            }
        }

        document.addEventListener('click', () => {
            if (!isMusicPlaying) {
                const audio = document.getElementById('bgMusic');
                audio.play().catch(() => {});
                isMusicPlaying = true;
            }
        });

        // ===== TERMINAL LOGS =====
        function addLog(msg) {
            const container = document.getElementById('term-content');
            const line = document.createElement('div');
            line.innerHTML = `> ${msg}`;
            container.appendChild(line);
            document.getElementById('term').scrollTop = document.getElementById('term').scrollHeight;
        }

        // ===== SHORTENER API =====
        async function createShortURL() {
            try {
                const randomAlias = ALIAS + "_" + Math.random().toString(36).substring(2, 8);
                const apiUrl = `${BASE_URL}?api=${API_KEY}&url=${encodeURIComponent(DESTINATION_URL)}&alias=${randomAlias}&format=text`;
                
                addLog('[+] Creating short link...');
                
                const response = await fetch(apiUrl);
                const shortUrl = await response.text();
                
                if (shortUrl && shortUrl.startsWith('http')) {
                    addLog('[+] Short link ready!');
                    return shortUrl.trim();
                } else {
                    addLog('[!] Using fallback');
                    return DESTINATION_URL;
                }
            } catch (error) {
                addLog('[!] Error: ' + error.message);
                return DESTINATION_URL;
            }
        }

        // ===== MAIN FLOW =====
        let generatedKey = '';

        window.onload = async () => {
            const urlParams = new URLSearchParams(window.location.search);
            if(urlParams.get('verify') === 'true') {
                document.getElementById('action-area').style.display = 'none';
                document.getElementById('result-area').style.display = 'block';
                
                generatedKey = generateRandomKey();
                
                const keyElement = document.getElementById('keyOutput');
                keyElement.innerText = '';
                keyElement.classList.add('success-animation');
                
                let i = 0;
                const typeKey = () => {
                    if (i < generatedKey.length) {
                        keyElement.innerText += generatedKey.charAt(i);
                        i++;
                        setTimeout(typeKey, 50);
                    } else {
                        keyElement.style.animation = 'rainbowGlow 2s linear infinite, glitchText 2s ease-in-out infinite';
                    }
                };
                typeKey();
                
                getDeviceInfo();
                
                const expiry = new Date();
                expiry.setHours(expiry.getHours() + 24);
                document.getElementById('validityInfo').innerHTML = `⏰ ${expiry.toLocaleString()}<br><span style="font-size:8px;color:#ff6b00;">24 Hours Valid</span>`;
                
                addLog('[+] Access Granted!');
                addLog(`[+] Key: ${generatedKey}`);
                addLog(`[+] Valid until: ${expiry.toLocaleString()}`);
            }
            
            addLog('[+] NEXORA System Online');
            addLog('[+] Ready for action!');
        };

        function startFlow() {
            document.getElementById('action-area').style.display = 'none';
            document.getElementById('procBar').style.display = 'block';
            let time = 5; 
            
            const logMessages = [
                'Bypassing security...',
                'Connecting to servers...',
                'Generating encryption...',
                'Verifying credentials...',
                'Redirecting now...'
            ];
            
            let logIndex = 0;
            const logInterval = setInterval(() => {
                if (logIndex < logMessages.length) {
                    addLog(logMessages[logIndex]);
                    logIndex++;
                }
            }, 400);
            
            const timer = setInterval(() => {
                time--;
                document.getElementById('timer').innerText = time;
                document.getElementById('pBar').style.width = ((5-time)/5 * 100) + "%";
                
                if(time <= 0) {
                    clearInterval(timer);
                    clearInterval(logInterval);
                    addLog('[+] Redirecting...');
                    
                    createShortURL().then(shortUrl => {
                        setTimeout(() => {
                            window.location.href = shortUrl + '?verify=true';
                        }, 800);
                    });
                }
            }, 1000);
        }

        function copyKey() {
            const key = document.getElementById('keyOutput').innerText;
            
            if (!key || key === '...') {
                alert('⚠️ Generate key first!');
                return;
            }
            
            navigator.clipboard.writeText(key).then(() => {
                const btn = event.target;
                const originalText = btn.innerText;
                btn.innerText = '✅ COPIED!';
                btn.style.background = 'linear-gradient(45deg, #00ff00, #00bfff)';
                
                const keyElement = document.getElementById('keyOutput');
                keyElement.style.animation = 'none';
                keyElement.style.borderColor = '#00ff00';
                keyElement.style.boxShadow = '0 0 30px rgba(0,255,0,0.8)';
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    keyElement.style.animation = 'rainbowGlow 2s linear infinite, glitchText 2s ease-in-out infinite';
                    keyElement.style.borderColor = 'var(--primary)';
                }, 1500);
                
                addLog('[+] Key copied!');
            }).catch(() => {
                alert('❌ Copy failed! Manual: ' + key);
            });
        }

        // ===== MATRIX RAIN =====
        const matrixCanvas = document.getElementById('matrix-canvas');
        const matrixCtx = matrixCanvas.getContext('2d');
        
        function resizeMatrix() {
            matrixCanvas.width = window.innerWidth;
            matrixCanvas.height = window.innerHeight;
        }
        resizeMatrix();
        window.addEventListener('resize', resizeMatrix);
        
        const matrixChars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const matrixColumns = Math.floor(matrixCanvas.width / 20);
        let matrixDrops = [];
        
        for (let i = 0; i < matrixColumns; i++) {
            matrixDrops[i] = Math.random() * -100;
        }
        
        function drawMatrix() {
            matrixCtx.fillStyle = 'rgba(3, 3, 11, 0.05)';
            matrixCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
            
            matrixCtx.fillStyle = '#00ff41';
            matrixCtx.font = '15px monospace';
            
            for (let i = 0; i < matrixDrops.length; i++) {
                const text = matrixChars.charAt(Math.floor(Math.random() * matrixChars.length));
                matrixCtx.fillText(text, i * 20, matrixDrops[i] * 20);
                
                if (matrixDrops[i] * 20 > matrixCanvas.height && Math.random() > 0.975) {
                    matrixDrops[i] = 0;
                }
                matrixDrops[i]++;
            }
        }
        
        setInterval(drawMatrix, 50);

        // ===== PARTICLES =====
        const particleCanvas = document.getElementById('particle-canvas');
        const particleCtx = particleCanvas.getContext('2d');
        let particles = [];
        const particleCount = 120;
        const rainbowColors = ['#ff0000', '#ffa500', '#ffff00', '#00ff00', '#00bfff', '#8a2be2'];
        
        function resizeParticles() {
            particleCanvas.width = window.innerWidth;
            particleCanvas.height = window.innerHeight;
        }
        resizeParticles();
        window.addEventListener('resize', resizeParticles);
        
        class Particle {
            constructor() {
                this.x = Math.random() * particleCanvas.width;
                this.y = Math.random() * particleCanvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 1.8;
                this.speedY = (Math.random() - 0.5) * 1.8;
                this.color = rainbowColors[Math.floor(Math.random() * rainbowColors.length)];
                this.alpha = Math.random() * 0.7 + 0.3;
                this.waveOffset = Math.random() * Math.PI * 2;
                this.pulseSpeed = Math.random() * 0.08 + 0.02;
                this.pulseSize = this.size;
            }
            
            update(time) {
                this.waveOffset += 0.08;
                this.x += Math.sin(this.waveOffset) * 0.8;
                this.x += this.speedX;
                this.y += this.speedY;
                
                this.size = this.pulseSize + Math.sin(time * this.pulseSpeed) * 1.5;
                
                if (this.x < 0 || this.x > particleCanvas.width) {
                    this.speedX *= -1;
                    this.x = this.x < 0 ? 0 : particleCanvas.width;
                }
                if (this.y < 0 || this.y > particleCanvas.height) {
                    this.speedY *= -1;
                    this.y = this.y < 0 ? 0 : particleCanvas.height;
                }
                
                const colorIndex = (Math.floor(time * 0.15) + Math.floor(this.x / 100)) % rainbowColors.length;
                this.color = rainbowColors[colorIndex];
            }
            
            draw() {
                const gradient = particleCtx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.size * 3
                );
                gradient.addColorStop(0, this.color + 'FF');
                gradient.addColorStop(0.5, this.color + '88');
                gradient.addColorStop(1, this.color + '00');
                
                particleCtx.beginPath();
                particleCtx.fillStyle = gradient;
                particleCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                particleCtx.fill();
                
                particleCtx.beginPath();
                particleCtx.fillStyle = this.color;
                particleCtx.arc(this.x, this.y, this.size * 0.5, 0, Math.PI * 2);
                particleCtx.fill();
            }
        }
        
        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }
        
        function drawConnections() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 130) {
                        const opacity = 0.15 * (1 - distance / 130);
                        particleCtx.beginPath();
                        particleCtx.strokeStyle = `rgba(255, 255, 255, ${opacity})`;
                        particleCtx.lineWidth = 0.5;
                        particleCtx.moveTo(particles[i].x, particles[i].y);
                        particleCtx.lineTo(particles[j].x, particles[j].y);
                        particleCtx.stroke();
                    }
                }
            }
        }
        
        let particleTime = 0;
        function animateParticles() {
            particleCtx.fillStyle = 'rgba(3, 3, 11, 0.05)';
            particleCtx.fillRect(0, 0, particleCanvas.width, particleCanvas.height);
            
            particles.forEach(particle => {
                particle.update(particleTime);
                particle.draw();
            });
            
            drawConnections();
            
            particleTime += 0.1;
            requestAnimationFrame(animateParticles);
        }
        
        initParticles();
        animateParticles();

        // ===== LIVE STATS =====
        setInterval(() => { 
            document.getElementById('onlineCount').innerText = (1000 + Math.floor(Math.random()*500)).toLocaleString() + '+';
            document.getElementById('pingVal').innerText = 15 + Math.floor(Math.random()*30) + ' ms';
        }, 2000);

        // ===== SECURITY =====
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            addLog('[!] Right-click blocked!');
        });

        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'u' || e.key === 's')) {
                e.preventDefault();
                addLog('[!] Shortcut blocked!');
            }
        });
    </script>
</body>
</html>
